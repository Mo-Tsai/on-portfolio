<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ON Design Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #0e0e0c;
    color: #f0efe8;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .center {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .logo-img {
    width: 120px;
    margin-bottom: 32px;
    opacity: 0.92;
  }
  .divider {
    width: 32px;
    height: 0.5px;
    background: #2a2a26;
    margin-bottom: 32px;
  }
  .tagline-zh {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: #f0efe8;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .tagline-en {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.22em;
    color: #4a4a44;
    margin-bottom: 36px;
    text-transform: uppercase;
  }
  .sub {
    font-size: 8px;
    font-weight: 300;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #2a2a26;
  }
</style>
</head>
<body>
<div class="center">
  <img class="logo-img" src="assets/ON_White_logo.png" alt="ON Design Lab">
  <div class="divider"></div>
  <h1 class="tagline-zh">品牌翻譯成空間</h1>
  <p class="tagline-en">Brand logic translated into space</p>
  <p class="sub">網站即將上線</p>
</div>
</body>
</html>
