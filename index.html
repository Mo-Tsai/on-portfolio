<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ON Design Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #0e0e0c;
    color: #f0efe8;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .center {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .logo {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: #f0efe8;
    margin-bottom: 28px;
  }
  .divider {
    width: 32px;
    height: 0.5px;
    background: #2a2a26;
    margin-bottom: 28px;
  }
  .tagline {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: #f0efe8;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  .sub {
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #2a2a26;
  }
</style>
</head>
<body>
<div class="center">
  <p class="logo">ON Design Lab</p>
  <div class="divider"></div>
  <h1 class="tagline">品牌翻譯成空間</h1>
  <p class="sub">網站即將上線</p>
</div>
</body>
</html>
