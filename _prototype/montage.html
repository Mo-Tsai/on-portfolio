<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>蒙太奇原型 — ON Design Lab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden}
a{color:#fafaf8;text-decoration:none}

:root{
  --n:7;              /* 格數 n×n，只用奇數 */
  --hold:2600ms;      /* 大畫面停留 */
  --dur:1800ms;       /* 收縮時間 */
  --ease:cubic-bezier(.22,.61,.36,1);
  --gray:1;           /* 黑白程度 0–1 */
  --dens:.28;         /* 牆的濃度（透明度） */
  --haze:5px;         /* 照片霧化模糊 */
  --bright:1;         /* 亮度 */
  --fade:1100ms;      /* 格子浮現 */
  --veil:16px;        /* logo 背後霧化 */
}

.page{height:100vh;display:grid;grid-template-columns:1fr 1fr;opacity:0;transition:opacity .8s ease}
.page.visible{opacity:1}
.half{position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:flex-end}

/* ── 整面牆（格子＋大畫面都在裡面，霧化與濃度一起套用在這一層）──
   稍微放大 6%，讓模糊的邊緣落在畫面外，不會出現暈邊 */
.wall{
  position:absolute;inset:0;transform:scale(1.06);
  transition:filter var(--dur) ease,opacity var(--dur) ease;
}
.wall.hazed{
  filter:grayscale(var(--gray)) blur(var(--haze)) brightness(var(--bright));
  opacity:var(--dens);
}

.grid{
  position:absolute;inset:0;display:grid;
  grid-template-columns:repeat(var(--n),1fr);
  grid-template-rows:repeat(var(--n),1fr);
}
.tile{
  background-size:cover;background-position:center;
  opacity:0;transition:opacity var(--fade) ease;
}
.tile.on{opacity:1}

/* ── 大畫面：現行首頁那兩張。以自己的中心點原地收縮，最後剛好等於正中央那一格 ── */
.hero{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background-size:cover;background-position:center;
  transform-origin:center center;          /* 就是「以它為中心點」 */
  transition:transform var(--dur) var(--ease);
  will-change:transform;
}
.half[data-side=c] .hero{background-image:url('/網頁首頁兩張/商空.webp')}
.half[data-side=r] .hero{background-image:url('/網頁首頁兩張/住家.webp')}

/* 滑到那半邊：牆稍微濃一點、清楚一點（沒人看的時候完全靜止） */
body.hoverlive .half:hover .wall.hazed{
  opacity:calc(var(--dens) + .22);
  filter:grayscale(calc(var(--gray) * .65)) blur(calc(var(--haze) * .35)) brightness(var(--bright));
  transition:filter .7s ease,opacity .7s ease;
}

/* ── 前景文字 ── */
.half-content{
  position:relative;z-index:3;width:100%;padding:2.5rem;
  border-top:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;align-items:flex-end;
}
.label-en{font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:.5rem}
.label-zh{font-size:clamp(1.2rem,2.4vw,1.8rem);font-weight:300;letter-spacing:.04em;color:#fafaf8}
.label-count{font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.22);margin-top:.4rem}
.label-arrow{font-size:1.4rem;color:rgba(255,255,255,.2)}
.split{position:fixed;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.1);z-index:10;pointer-events:none}

/* ── ON logo ＋ 背後的霧化底 ── */
.logo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none}
.logo.off{display:none}
.logo-veil{
  position:absolute;left:50%;top:50%;
  width:460px;height:300px;transform:translate(-50%,-50%);
  backdrop-filter:blur(var(--veil)) brightness(.5);
  -webkit-backdrop-filter:blur(var(--veil)) brightness(.5);
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,rgba(0,0,0,.55) 55%,transparent 75%);
          mask-image:radial-gradient(ellipse at center,#000 30%,rgba(0,0,0,.55) 55%,transparent 75%);
  opacity:0;transition:opacity 1.1s ease;
}
.logo.veiled .logo-veil{opacity:1}
.logo img{position:relative;width:216px;height:auto;display:block}

/* ── 控制面板 ── */
#panel{
  position:fixed;top:14px;left:14px;z-index:100;width:238px;
  background:rgba(8,8,8,.9);border:1px solid rgba(255,255,255,.14);border-radius:4px;
  padding:12px 13px;color:rgba(255,255,255,.8);font-size:11px;line-height:1.5;
  backdrop-filter:blur(6px);
}
#panel.hide{display:none}
#panel h4{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);margin:0 0 9px;font-weight:400}
#panel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
#panel .row span{white-space:nowrap}
#panel input[type=range]{width:100px;accent-color:#fff}
#panel select{background:#111;color:#eee;border:1px solid rgba(255,255,255,.2);border-radius:3px;font-size:11px;padding:2px 4px}
#panel b{color:#fff;font-weight:400;min-width:44px;text-align:right;display:inline-block}
#panel hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:10px 0}
#panel .hint{color:rgba(255,255,255,.35);font-size:10px;line-height:1.6}
#panel .sw{cursor:pointer;user-select:none;padding:3px 8px;border:1px solid rgba(255,255,255,.2);border-radius:3px;font-size:10px;letter-spacing:.06em}
#panel .sw.on{background:#fff;color:#111;border-color:#fff}
#tip{position:fixed;bottom:12px;left:14px;z-index:100;font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.3)}

@media(max-width:680px){
  :root{--n:5}
  .page{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:100dvh}
  .half{height:50dvh}
  .half[data-side=c] .hero{background-image:url('/手機首頁兩張/商空.jpg')}
  .half[data-side=r] .hero{background-image:url('/手機首頁兩張/住家.jpg')}
  .logo{top:2rem;left:50%;transform:translateX(-50%)}
  .logo img{width:144px}
  .logo-veil{width:300px;height:180px}
  .split{display:none}
  .half-content{padding:1.5rem}
  #panel{width:calc(100vw - 28px);max-height:56vh;overflow:auto}
}
</style>
</head>
<body class="hoverlive">

<div class="page" id="page">
  <a href="#" class="half" data-side="c" onclick="return false">
    <div class="wall"><div class="grid"></div><div class="hero"></div></div>
    <div class="half-content">
      <div>
        <p class="label-en">Commercial</p>
        <p class="label-zh">商業空間</p>
        <p class="label-count">18 projects →</p>
      </div>
      <span class="label-arrow">→</span>
    </div>
  </a>

  <a href="#" class="half" data-side="r" onclick="return false">
    <div class="wall"><div class="grid"></div><div class="hero"></div></div>
    <div class="half-content">
      <div>
        <p class="label-en">Residential</p>
        <p class="label-zh">住家空間</p>
        <p class="label-count">11 projects →</p>
      </div>
      <span class="label-arrow">→</span>
    </div>
  </a>
</div>

<div class="logo" id="logo">
  <div class="logo-veil"></div>
  <img src="/assets/ON_White_logo.png" alt="ON Design Lab">
</div>
<div class="split"></div>

<div id="panel">
  <h4>蒙太奇原型</h4>
  <div class="row"><span>格數</span>
    <select id="k-n">
      <option value="5">5×5（25 格）</option>
      <option value="7" selected>7×7（49 格）</option>
      <option value="9">9×9（81 格）</option>
    </select></div>
  <div class="row"><span>大畫面停留</span><input type="range" id="k-hold" min="800" max="6000" step="100" value="2600"><b id="v-hold"></b></div>
  <div class="row"><span>收縮時間</span><input type="range" id="k-dur" min="600" max="4000" step="100" value="1800"><b id="v-dur"></b></div>
  <div class="row"><span>格子浮現</span><input type="range" id="k-fade" min="200" max="2500" step="50" value="1100"><b id="v-fade"></b></div>
  <div class="row"><span>緩動</span>
    <select id="k-ease">
      <option value="cubic-bezier(.22,.61,.36,1)">沉穩</option>
      <option value="cubic-bezier(.16,1,.3,1)">慢收尾</option>
      <option value="cubic-bezier(.4,0,.2,1)">俐落</option>
      <option value="cubic-bezier(.65,0,.35,1)">兩頭慢</option>
      <option value="linear">線性</option>
    </select></div>
  <hr>
  <div class="row"><span>牆的濃度</span><input type="range" id="k-dens" min="5" max="100" step="1" value="28"><b id="v-dens"></b></div>
  <div class="row"><span>照片霧化</span><input type="range" id="k-haze" min="0" max="20" step="1" value="5"><b id="v-haze"></b></div>
  <div class="row"><span>黑白程度</span><input type="range" id="k-gray" min="0" max="100" step="5" value="100"><b id="v-gray"></b></div>
  <div class="row"><span>亮度</span><input type="range" id="k-bright" min="30" max="150" step="5" value="100"><b id="v-bright"></b></div>
  <div class="row"><span>滑過才回亮</span><span class="sw on" id="k-hover">開</span></div>
  <hr>
  <div class="row"><span>顯示 ON logo</span><span class="sw on" id="k-logo">開</span></div>
  <div class="row"><span>logo 背後霧化</span><input type="range" id="k-veil" min="0" max="40" step="2" value="16"><b id="v-veil"></b></div>
  <hr>
  <p class="hint">H 收合面板　R 重播<br>設定會自動記住</p>
</div>
<div id="tip">按 H 收合面板</div>

<script>
const $ = s => document.querySelector(s);
const root = document.documentElement;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const DEF = {n:7, hold:2600, dur:1800, fade:1100, ease:'cubic-bezier(.22,.61,.36,1)',
             dens:28, haze:5, gray:100, bright:100, hover:1, logo:1, veil:16};
let CFG = Object.assign({}, DEF);
try { Object.assign(CFG, JSON.parse(localStorage.getItem('montage4') || '{}')); } catch(e) {}

const isMobile = () => matchMedia('(max-width:680px)').matches;
const gridN = () => isMobile() ? 5 : CFG.n;     /* 手機格子太小，固定 5×5 */

function applyCfg(){
  root.style.setProperty('--n', gridN());
  root.style.setProperty('--hold', CFG.hold + 'ms');
  root.style.setProperty('--dur', CFG.dur + 'ms');
  root.style.setProperty('--fade', CFG.fade + 'ms');
  root.style.setProperty('--ease', CFG.ease);
  root.style.setProperty('--dens', CFG.dens / 100);
  root.style.setProperty('--haze', CFG.haze + 'px');
  root.style.setProperty('--gray', CFG.gray / 100);
  root.style.setProperty('--bright', CFG.bright / 100);
  root.style.setProperty('--veil', CFG.veil + 'px');
  document.body.classList.toggle('hoverlive', !!CFG.hover);
  $('#logo').classList.toggle('off', !CFG.logo);
  $('#v-hold').textContent   = (CFG.hold/1000).toFixed(1) + 's';
  $('#v-dur').textContent    = (CFG.dur/1000).toFixed(1) + 's';
  $('#v-fade').textContent   = (CFG.fade/1000).toFixed(2) + 's';
  $('#v-dens').textContent   = CFG.dens + '%';
  $('#v-haze').textContent   = CFG.haze ? CFG.haze + 'px' : '無';
  $('#v-gray').textContent   = CFG.gray + '%';
  $('#v-bright').textContent = CFG.bright + '%';
  $('#v-veil').textContent   = CFG.veil ? CFG.veil + 'px' : '無';
  ['hover','logo'].forEach(k => {
    const el = $('#k-' + k);
    el.classList.toggle('on', !!CFG[k]);
    el.textContent = CFG[k] ? '開' : '關';
  });
  try { localStorage.setItem('montage4', JSON.stringify(CFG)); } catch(e) {}
}

let M = null, gen = 0;

async function boot(){
  M = await fetch('tiles/manifest.json').then(r => r.json());
  applyCfg();
  bindPanel();
  requestAnimationFrame(() => $('#page').classList.add('visible'));
  restart();
}

function restart(){
  gen++;
  const my = gen;
  $('#logo').classList.remove('veiled');
  ['c','r'].forEach((side, i) => build(side, my, i * 900));   /* 左右錯開 0.9s */
}

function instant(el, fn){
  const t = el.style.transition;
  el.style.transition = 'none';
  fn();
  void el.offsetWidth;
  el.style.transition = t;
}

function build(side, my, delay){
  const half = document.querySelector('.half[data-side="' + side + '"]');
  const wall = half.querySelector('.wall');
  const grid = half.querySelector('.grid');
  const hero = half.querySelector('.hero');
  const n = gridN(), total = n * n;
  const list = M[side];

  grid.style.setProperty('--n', n);
  grid.innerHTML = '';
  for (let i = 0; i < total; i++){
    const d = document.createElement('div');
    d.className = 'tile';
    /* 先不掛圖 — 等大畫面停留那幾秒才載，不跟它搶頻寬 */
    d.dataset.src = "url('tiles/" + list[i % list.length].t + "')";
    grid.appendChild(d);
  }

  wall.classList.remove('hazed');
  instant(hero, () => { hero.style.transform = 'none'; });

  run(my, {wall, grid, hero, tiles: [...grid.children], n, delay});
}

async function run(my, C){
  const alive = () => my === gen;

  await sleep(C.delay); if (!alive()) return;

  /* 停留期間，背景默默把整面格子的圖載進來 */
  C.tiles.forEach(t => {
    if (t.dataset.src){ t.style.backgroundImage = t.dataset.src; delete t.dataset.src; }
  });
  await sleep(CFG.hold); if (!alive()) return;

  /* 大畫面以自己的中心點原地收縮 → 正中央那一格
     n 是奇數，所以純中心縮放的落點剛好就是中央格，不需要任何位移 */
  const mid = (C.n - 1) / 2, cell = mid * C.n + mid;
  C.tiles.forEach((t, i) => {
    if (i === cell) return;                       /* 這格由大畫面自己佔著 */
    const d = Math.max(Math.abs(i % C.n - mid), Math.abs(Math.floor(i / C.n) - mid));
    t.style.transitionDelay = (d * 70) + 'ms';
    t.classList.add('on');
  });
  C.hero.style.transform = 'scale(' + (1 / C.n) + ')';
  C.wall.classList.add('hazed');                  /* 整面（含大畫面）一起轉成灰、霧、降濃度 */
  $('#logo').classList.add('veiled');

  await sleep(CFG.dur); if (!alive()) return;
  C.tiles.forEach(t => t.style.transitionDelay = '0ms');
  /* 到這裡就停住 — 不循環、不再動 */
}

function bindPanel(){
  const bind = (id, key, rebuild) => {
    const el = $('#k-' + id);
    el.value = CFG[key];
    el.addEventListener('input', () => {
      CFG[key] = (typeof DEF[key] === 'number') ? +el.value : el.value;
      applyCfg();
      if (rebuild) restart();
    });
  };
  bind('n','n',true);
  bind('hold','hold'); bind('dur','dur'); bind('fade','fade'); bind('ease','ease');
  bind('dens','dens'); bind('haze','haze'); bind('gray','gray'); bind('bright','bright');
  bind('veil','veil');

  ['hover','logo'].forEach(key => {
    $('#k-' + key).addEventListener('click', () => { CFG[key] = CFG[key] ? 0 : 1; applyCfg(); });
  });

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'h'){
      $('#panel').classList.toggle('hide');
      $('#tip').style.display = $('#panel').classList.contains('hide') ? '' : 'none';
    }
    if (k === 'r') restart();
  });
  $('#tip').style.display = 'none';

  let last = isMobile();
  addEventListener('resize', () => { if (isMobile() !== last){ last = isMobile(); applyCfg(); restart(); } });
}

boot();
</script>
</body>
</html>
