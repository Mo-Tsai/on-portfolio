<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>蒙太奇原型 — ON Design Lab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden}
a{color:#fafaf8;text-decoration:none}

:root{
  --n:6;              /* 格數 n×n */
  --hold:2600ms;      /* 主畫面停留 */
  --dur:1400ms;       /* 縮放時間 */
  --ease:cubic-bezier(.22,.61,.36,1);
  --gray:1;           /* 黑白程度 0–1 */
  --bright:.45;       /* 亮度，跟現行首頁一致 */
  --fade:900ms;       /* 格子浮現 */
}

/* ── 版面：完全比照現行首頁 ── */
.page{height:100vh;display:grid;grid-template-columns:1fr 1fr;opacity:0;transition:opacity .8s ease}
.page.visible{opacity:1}
.half{position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:flex-end}

/* ── 格子牆 ── */
.grid{
  position:absolute;inset:0;display:grid;
  grid-template-columns:repeat(var(--n),1fr);
  grid-template-rows:repeat(var(--n),1fr);
}
.tile{
  background-size:cover;background-position:center;
  filter:grayscale(var(--gray)) brightness(var(--bright));
  opacity:0;
  transition:opacity var(--fade) ease,filter .7s ease;
}
.tile.on{opacity:1}

/* ── 主角 ── */
.hero{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background-size:cover;background-position:center;
  transform-origin:0 0;
  filter:grayscale(0) brightness(var(--bright));
  transition:transform var(--dur) var(--ease),opacity .35s ease;
  will-change:transform;
}
.hero.hidden{opacity:0}

/* 滑到那半邊：整面回一點顏色和亮度（沒人看的時候完全靜止） */
body.hoverlive .half:hover .tile{filter:grayscale(calc(var(--gray) * .55)) brightness(calc(var(--bright) + .2))}
body.hoverlive .half:hover .hero{filter:grayscale(0) brightness(calc(var(--bright) + .2))}

/* ── 前景文字（照抄現行首頁） ── */
.half-content{
  position:relative;z-index:3;width:100%;padding:2.5rem;
  border-top:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;align-items:flex-end;
}
.label-en{font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:.5rem}
.label-zh{font-size:clamp(1.2rem,2.4vw,1.8rem);font-weight:300;letter-spacing:.04em;color:#fafaf8}
.label-count{font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.22);margin-top:.4rem}
.label-arrow{font-size:1.4rem;color:rgba(255,255,255,.2)}
.logo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none}
.logo img{width:216px;height:auto;display:block}
.tagline{position:fixed;top:50%;left:50%;transform:translate(-50%,60px);z-index:20;pointer-events:none;text-align:center}
.tagline-zh{font-size:clamp(1rem,2vw,1.4rem);font-weight:300;letter-spacing:.1em;color:rgba(255,255,255,.7);margin-bottom:.4rem}
.tagline-en{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:.8rem}
.tagline-desc{font-size:11px;line-height:1.8;color:rgba(255,255,255,.28);max-width:320px;margin:0 auto}
.split{position:fixed;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.1);z-index:10;pointer-events:none}

/* ── 案名（除錯用，可關） ── */
.caption{
  position:absolute;left:2.5rem;top:2.5rem;z-index:4;
  font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.55);
  opacity:0;transition:opacity .4s ease;pointer-events:none;
}
body.showname .caption{opacity:1}

/* ── 控制面板 ── */
#panel{
  position:fixed;top:14px;left:14px;z-index:100;width:236px;
  background:rgba(8,8,8,.9);border:1px solid rgba(255,255,255,.14);border-radius:4px;
  padding:12px 13px;color:rgba(255,255,255,.8);font-size:11px;line-height:1.5;
  backdrop-filter:blur(6px);
}
#panel.hide{display:none}
#panel h4{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);
  margin:0 0 9px;font-weight:400}
#panel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
#panel .row span{white-space:nowrap}
#panel input[type=range]{width:104px;accent-color:#fff}
#panel select{background:#111;color:#eee;border:1px solid rgba(255,255,255,.2);
  border-radius:3px;font-size:11px;padding:2px 4px}
#panel b{color:#fff;font-weight:400;min-width:44px;text-align:right;display:inline-block}
#panel hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:10px 0}
#panel .hint{color:rgba(255,255,255,.35);font-size:10px;line-height:1.6}
#panel .sw{cursor:pointer;user-select:none;padding:3px 8px;border:1px solid rgba(255,255,255,.2);
  border-radius:3px;font-size:10px;letter-spacing:.06em}
#panel .sw.on{background:#fff;color:#111;border-color:#fff}
#tip{position:fixed;bottom:12px;left:14px;z-index:100;font-size:10px;letter-spacing:.1em;
  color:rgba(255,255,255,.3)}

/* ── 手機 ── */
@media(max-width:680px){
  :root{--n:4}                        /* 手機格子降到 4×4，一樣是 n×n 所以縮放邏輯不變 */
  .page{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:100dvh}
  .half{height:50dvh}
  .logo{top:2rem;left:50%;transform:translateX(-50%)}
  .logo img{width:144px}
  .tagline{top:auto;bottom:50%;left:50%;transform:translate(-50%,50%)}
  .tagline-desc{font-size:10px;max-width:260px}
  .split{display:none}
  .half-content{padding:1.5rem}
  .caption{left:1.5rem;top:1.5rem}
  #panel{width:calc(100vw - 28px);max-height:52vh;overflow:auto}
}
</style>
</head>
<body class="hoverlive">

<div class="page" id="page">
  <a href="#" class="half" data-side="c" onclick="return false">
    <div class="grid"></div>
    <div class="hero hidden"></div>
    <p class="caption"></p>
    <div class="half-content">
      <div>
        <p class="label-en">Commercial</p>
        <p class="label-zh">商業空間</p>
        <p class="label-count">18 projects →</p>
      </div>
      <span class="label-arrow">→</span>
    </div>
  </a>

  <a href="#" class="half" data-side="r" onclick="return false">
    <div class="grid"></div>
    <div class="hero hidden"></div>
    <p class="caption"></p>
    <div class="half-content">
      <div>
        <p class="label-en">Residential</p>
        <p class="label-zh">住家空間</p>
        <p class="label-count">11 projects →</p>
      </div>
      <span class="label-arrow">→</span>
    </div>
  </a>
</div>

<div class="logo"><img src="/assets/ON_White_logo.png" alt="ON Design Lab"></div>
<div class="tagline">
  <p class="tagline-zh">品牌翻譯成空間</p>
  <p class="tagline-en">Brand Logic Translated into Space</p>
  <p class="tagline-desc">我們不從風格出發。從品牌的核心信念出發，找到空間應該說的話。</p>
</div>
<div class="split"></div>

<div id="panel">
  <h4>蒙太奇原型</h4>
  <div class="row"><span>格數</span>
    <select id="k-n"><option value="4">4×4（16）</option><option value="5">5×5（25）</option>
    <option value="6" selected>6×6（36）</option></select></div>
  <div class="row"><span>主畫面停留</span><input type="range" id="k-hold" min="800" max="6000" step="100" value="2600"><b id="v-hold"></b></div>
  <div class="row"><span>縮放時間</span><input type="range" id="k-dur" min="400" max="3000" step="50" value="1400"><b id="v-dur"></b></div>
  <div class="row"><span>格子浮現</span><input type="range" id="k-fade" min="200" max="2500" step="50" value="900"><b id="v-fade"></b></div>
  <div class="row"><span>緩動</span>
    <select id="k-ease">
      <option value="cubic-bezier(.22,.61,.36,1)">沉穩</option>
      <option value="cubic-bezier(.16,1,.3,1)">慢收尾</option>
      <option value="cubic-bezier(.4,0,.2,1)">俐落</option>
      <option value="cubic-bezier(.65,0,.35,1)">兩頭慢</option>
      <option value="linear">線性</option>
    </select></div>
  <hr>
  <div class="row"><span>黑白程度</span><input type="range" id="k-gray" min="0" max="100" step="5" value="100"><b id="v-gray"></b></div>
  <div class="row"><span>亮度</span><input type="range" id="k-bright" min="20" max="100" step="5" value="45"><b id="v-bright"></b></div>
  <div class="row"><span>主角保持彩色</span><span class="sw on" id="k-herocolor">開</span></div>
  <div class="row"><span>滑過才回色</span><span class="sw on" id="k-hover">開</span></div>
  <hr>
  <div class="row"><span>循環播放</span><span class="sw" id="k-loop">關</span></div>
  <div class="row"><span>循環間隔</span><input type="range" id="k-gap" min="0" max="8000" step="250" value="2500"><b id="v-gap"></b></div>
  <div class="row"><span>顯示案名</span><span class="sw" id="k-name">關</span></div>
  <hr>
  <p class="hint">H 收合面板　R 重播　L 切換循環<br>設定會自動記住</p>
</div>
<div id="tip">按 H 收合面板</div>

<script>
const $ = s => document.querySelector(s);
const root = document.documentElement;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ── 設定 ── */
const DEF = {n:6, hold:2600, dur:1400, fade:900, ease:'cubic-bezier(.22,.61,.36,1)',
             gray:100, bright:45, herocolor:1, hover:1, loop:0, gap:2500, name:0};
let CFG = Object.assign({}, DEF);
try { Object.assign(CFG, JSON.parse(localStorage.getItem('montage') || '{}')); } catch(e) {}

function applyCfg(){
  root.style.setProperty('--n', CFG.n);
  root.style.setProperty('--hold', CFG.hold + 'ms');
  root.style.setProperty('--dur', CFG.dur + 'ms');
  root.style.setProperty('--fade', CFG.fade + 'ms');
  root.style.setProperty('--ease', CFG.ease);
  root.style.setProperty('--gray', CFG.gray / 100);
  root.style.setProperty('--bright', CFG.bright / 100);
  document.body.classList.toggle('hoverlive', !!CFG.hover);
  document.body.classList.toggle('showname', !!CFG.name);
  $('#v-hold').textContent   = (CFG.hold/1000).toFixed(1) + 's';
  $('#v-dur').textContent    = (CFG.dur/1000).toFixed(2) + 's';
  $('#v-fade').textContent   = (CFG.fade/1000).toFixed(2) + 's';
  $('#v-gap').textContent    = (CFG.gap/1000).toFixed(2) + 's';
  $('#v-gray').textContent   = CFG.gray + '%';
  $('#v-bright').textContent = CFG.bright + '%';
  ['herocolor','hover','loop','name'].forEach(k => {
    const el = $('#k-' + k);
    el.classList.toggle('on', !!CFG[k]);
    el.textContent = CFG[k] ? '開' : '關';
  });
  try { localStorage.setItem('montage', JSON.stringify(CFG)); } catch(e) {}
}

/* 手機強制 4×4（格子太小放不下 36 張） */
const isMobile = () => matchMedia('(max-width:680px)').matches;
const gridN = () => isMobile() ? 4 : CFG.n;

/* ── 資料 ── */
let M = null, gen = 0;

async function boot(){
  M = await fetch('tiles/manifest.json').then(r => r.json());
  applyCfg();
  bindPanel();
  requestAnimationFrame(() => $('#page').classList.add('visible'));
  restart();
}

function restart(){
  gen++;
  const my = gen;
  ['c','r'].forEach((side, i) => build(side, my, i * 900));   // 左右錯開 0.9s
}

function build(side, my, delay){
  const half = document.querySelector('.half[data-side="' + side + '"]');
  const grid = half.querySelector('.grid');
  const hero = half.querySelector('.hero');
  const cap  = half.querySelector('.caption');
  const n = gridN(), total = n * n;
  const list = M[side];

  /* 備有彩色大圖的格子要平均散佈在整面牆上，
     否則主角永遠只會出現在前兩排 */
  const withHero = list.filter(r => r.h), plain = list.filter(r => !r.h);
  const arr = new Array(total);
  const step = total / withHero.length;
  withHero.forEach((r, j) => {
    let p = Math.min(total - 1, Math.round(j * step));
    while (arr[p]) p = (p + 1) % total;
    arr[p] = r;
  });
  for (let i = 0, p = 0; i < total; i++) if (!arr[i]) arr[i] = plain[p++ % plain.length];

  grid.style.setProperty('--n', n);
  grid.innerHTML = '';
  arr.forEach(rec => {
    const d = document.createElement('div');
    d.className = 'tile';
    /* 先不掛圖 — 等主畫面停留那幾秒才載，不跟主角搶頻寬 */
    d.dataset.src = "url('tiles/" + rec.t + "')";
    grid.appendChild(d);
  });
  const tiles = [...grid.children];
  const heroIdx = [];
  arr.forEach((r, i) => { if (r.h) heroIdx.push(i); });

  run(my, {half, grid, hero, cap, tiles, n, list: arr, heroIdx, delay});
}

/* 把主角變形到第 i 格：先縮到 1/n，再平移到該格 */
function cellTransform(i, n){
  const col = i % n, row = Math.floor(i / n);
  return 'translate(' + (col * 100 / n) + '%,' + (row * 100 / n) + '%) scale(' + (1 / n) + ')';
}
function instant(el, fn){
  const t = el.style.transition;
  el.style.transition = 'none';
  fn();
  void el.offsetWidth;
  el.style.transition = t;
}

async function run(my, C){
  const alive = () => my === gen;
  let k = 0;                                  // heroIdx 的指標
  let idx = C.heroIdx[0];

  const setSrc = i => {
    const rec = C.list[i];
    C.hero.style.backgroundImage = "url('tiles/" + rec.h + "')";
    C.cap.textContent = rec.name;
  };
  /* 主畫面在停留時，背景把整面格子的圖載進來 */
  const loadTiles = () => C.tiles.forEach(t => {
    if (t.dataset.src){ t.style.backgroundImage = t.dataset.src; delete t.dataset.src; }
  });
  const rippleIn = from => {                  // 從主角那格往外一圈圈浮現
    const fc = from % C.n, fr = Math.floor(from / C.n);
    C.tiles.forEach((t, i) => {
      if (i === from) return;
      const d = Math.max(Math.abs(i % C.n - fc), Math.abs(Math.floor(i / C.n) - fr));
      t.style.transitionDelay = (d * 55) + 'ms';
      t.classList.add('on');
    });
  };

  await sleep(C.delay); if (!alive()) return;

  /* 首輪：主畫面滿版 → 停 → 縮回它自己那格 */
  setSrc(idx);
  instant(C.hero, () => { C.hero.style.transform = 'none'; });
  C.hero.classList.remove('hidden');
  await sleep(60); if (!alive()) return;

  loadTiles();                                /* 停留期間才去載格子的圖 */
  await sleep(CFG.hold); if (!alive()) return;
  rippleIn(idx);
  C.hero.style.transform = cellTransform(idx, C.n);
  await sleep(CFG.dur); if (!alive()) return;
  C.tiles.forEach(t => t.style.transitionDelay = '0ms');
  if (!CFG.herocolor){ C.hero.classList.add('hidden'); C.tiles[idx].classList.add('on'); }

  /* 之後：循環開著才繼續 */
  while (alive()){
    await sleep(200); if (!alive()) return;
    if (!CFG.loop) continue;

    await sleep(CFG.gap); if (!alive() || !CFG.loop) continue;

    /* 目前這格退回灰階群像 */
    C.tiles[idx].classList.add('on');
    C.hero.classList.add('hidden');
    await sleep(350); if (!alive()) return;

    /* 換下一格：瞬間移過去、換圖，再淡入變彩色 */
    k = (k + 1) % C.heroIdx.length;
    idx = C.heroIdx[k];
    setSrc(idx);
    instant(C.hero, () => { C.hero.style.transform = cellTransform(idx, C.n); });
    C.hero.classList.remove('hidden');
    await sleep(350); if (!alive()) return;

    /* 長大成主畫面 → 停 → 縮回去 */
    C.hero.style.transform = 'none';
    await sleep(CFG.dur + CFG.hold); if (!alive()) return;
    C.hero.style.transform = cellTransform(idx, C.n);
    await sleep(CFG.dur); if (!alive()) return;
    if (!CFG.herocolor){ C.hero.classList.add('hidden'); C.tiles[idx].classList.add('on'); }
  }
}

/* ── 面板 ── */
function bindPanel(){
  const num = (id, key, rebuild) => {
    const el = $('#k-' + id);
    el.value = CFG[key];
    el.addEventListener('input', () => {
      CFG[key] = (id === 'ease') ? el.value : +el.value;
      applyCfg();
      if (rebuild) restart();
    });
  };
  num('n','n',true); num('hold','hold'); num('dur','dur'); num('fade','fade');
  num('gap','gap'); num('gray','gray'); num('bright','bright');
  const ez = $('#k-ease'); ez.value = CFG.ease;
  ez.addEventListener('change', () => { CFG.ease = ez.value; applyCfg(); });

  ['herocolor','hover','loop','name'].forEach(key => {
    $('#k-' + key).addEventListener('click', () => { CFG[key] = CFG[key] ? 0 : 1; applyCfg(); });
  });

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'h'){ $('#panel').classList.toggle('hide'); $('#tip').style.display = $('#panel').classList.contains('hide') ? '' : 'none'; }
    if (k === 'r') restart();
    if (k === 'l'){ CFG.loop = CFG.loop ? 0 : 1; applyCfg(); }
  });
  $('#tip').style.display = 'none';

  let last = isMobile();
  addEventListener('resize', () => { if (isMobile() !== last){ last = isMobile(); restart(); } });
}

boot();
</script>
</body>
</html>
