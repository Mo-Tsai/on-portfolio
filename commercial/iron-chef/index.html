<script>
  const lbPhotos = [
    '../../images/iron-chef/0.jpg',
    '../../images/iron-chef/01.jpg',
    '../../images/iron-chef/03.jpg',
    '../../images/iron-chef/04.jpg',
    '../../images/iron-chef/05.jpg',
    '../../images/iron-chef/06.jpg',
    '../../images/iron-chef/7.jpg',
    '../../images/iron-chef/09.jpg',
    '../../images/iron-chef/14.jpg',
    '../../images/iron-chef/23.jpg',
    '../../images/iron-chef/27.jpg',
    '../../images/iron-chef/29.jpg',
    '../../images/iron-chef/31.jpg',
    '../../images/iron-chef/34.jpg',
  ];
  let lbIndex = 0;

  function openLightbox(i) {
    lbIndex = i;
    document.getElementById('lb-img').src = lbPhotos[i];
    document.getElementById('lightbox').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
    document.body.style.overflow = '';
  }
  function lbNext() {
    lbIndex = (lbIndex + 1) % lbPhotos.length;
    document.getElementById('lb-img').src = lbPhotos[lbIndex];
  }
  function lbPrev() {
    lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length;
    document.getElementById('lb-img').src = lbPhotos[lbIndex];
  }
  document.addEventListener('keydown', e => {
    if (document.getElementById('lightbox').style.display === 'flex') {
      if (e.key === 'ArrowRight') lbNext();
      if (e.key === 'ArrowLeft') lbPrev();
      if (e.key === 'Escape') closeLightbox();
    }
  });
</script>
