<script>
  const lbPhotos = [
    '../../images/fire-play/01.jpg',
    '../../images/fire-play/02.jpg',
    '../../images/fire-play/03.jpg',
    '../../images/fire-play/04.jpg',
    '../../images/fire-play/05.jpg',
    '../../images/fire-play/06.jpg',
    '../../images/fire-play/07.jpg',
    '../../images/fire-play/08.jpg',
    '../../images/fire-play/09.jpg',
    '../../images/fire-play/11.jpg',
    '../../images/fire-play/12.jpg',
  ];
  let lbIndex = 0;

  function openLightbox(i) {
    lbIndex = i;
    document.getElementById('lb-img').src = lbPhotos[i];
    document.getElementById('lightbox').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
    document.body.style.overflow = '';
  }
  function lbNext() {
    lbIndex = (lbIndex + 1) % lbPhotos.length;
    document.getElementById('lb-img').src = lbPhotos[lbIndex];
  }
  function lbPrev() {
    lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length;
    document.getElementById('lb-img').src = lbPhotos[lbIndex];
  }
  document.addEventListener('keydown', e => {
    if (document.getElementById('lightbox').style.display === 'flex') {
      if (e.key === 'ArrowRight') lbNext();
      if (e.key === 'ArrowLeft') lbPrev();
      if (e.key === 'Escape') closeLightbox();
    }
  });
</script>
