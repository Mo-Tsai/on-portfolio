<script>
  const lbPhotos = [
    '../../images/lalaport/01.jpg',
    '../../images/lalaport/03.jpg',
    '../../images/lalaport/04.jpg',
    '../../images/lalaport/05.jpg',
    '../../images/lalaport/07.jpg',
    '../../images/lalaport/08.jpg',
    '../../images/lalaport/10.jpg',
    '../../images/lalaport/12.jpg',
  ];
  let lbIndex = 0;

  function openLightbox(i) {
    lbIndex = i;
    document.getElementById('lb-img').src = lbPhotos[i];
    document.getElementById('lightbox').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
    document.body.style.overflow = '';
  }
  function lbNext() {
    lbIndex = (lbIndex + 1) % lbPhotos.length;
    document.getElementById('lb-img').src = lbPhotos[lbIndex];
  }
  function lbPrev() {
    lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length;
    document.getElementById('lb-img').src = lbPhotos[lbIndex];
  }
  document.addEventListener('keydown', e => {
    if (document.getElementById('lightbox').style.display === 'flex') {
      if (e.key === 'ArrowRight') lbNext();
      if (e.key === 'ArrowLeft') lbPrev();
      if (e.key === 'Escape') closeLightbox();
    }
  });
</script>
