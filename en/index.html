<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden}
a{color:#fafaf8;text-decoration:none}

/* ── Curtain ── */
#curtain{
  position:fixed;inset:0;z-index:200;
  background:#0a0a0a;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1s ease;
}
#curtain.out{opacity:0;pointer-events:none}
#curtain-logo{opacity:0;animation:cFade .8s ease .4s forwards}
#curtain-logo img{
  /* 進場 Logo 大小 — 可調整 */
  width:216px;height:auto;display:block;
}
@keyframes cFade{
  0%{opacity:0;transform:translateY(6px)}
  100%{opacity:1;transform:translateY(0)}
}

/* ── Page layout ── */
.page{
  height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr; /* 桌機：左右對分 */
  opacity:0;transition:opacity .8s ease;
}
.page.visible{opacity:1}

/* ── Each half ── */
.half{
  position:relative;overflow:hidden;cursor:pointer;
  display:flex;align-items:flex-end;
}
/* ── 進站蒙太奇 ──
   大畫面停一下，再以自己的中心點原地收成整面牆的其中一格。
   數值都在頁尾 <script> 的 MONTAGE 設定裡，只有那一處要改。
   關掉 JS、或系統設定了「減少動態效果」時，畫面就停在原本的大圖，跟以前一樣。 */
.wall{
  position:absolute;inset:0;
  transform:scale(1.06);              /* 放大一點，讓模糊的邊緣落在畫面外，不會有暈邊 */
  transition:filter var(--dur) ease,opacity var(--dur) ease,transform .9s ease;
}
.wall.hazed{
  filter:grayscale(var(--gray)) blur(var(--haze)) brightness(var(--bright));
  opacity:var(--dens);
}
.grid{
  position:absolute;inset:0;display:grid;
  grid-template-columns:repeat(var(--n),1fr);
  grid-template-rows:repeat(var(--n),1fr);
}
.tile{background-size:cover;background-position:center;opacity:0;transition:opacity var(--fade) ease}
.tile.on{opacity:1}

.hero{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background-size:cover;background-position:center;
  transform-origin:center center;     /* 以自己的中心點收縮，不需要任何位移 */
  filter:brightness(.45);             /* 靜止時跟原本的首頁一樣暗，下方文字才讀得到 */
  transition:transform var(--dur) var(--ease),filter var(--dur) ease;
  will-change:transform;
}
.wall.hazed .hero{filter:brightness(1)}   /* 收進去之後，亮度統一交給整面牆控制 */
.half:first-child .hero{background-image:url('/網頁首頁兩張/商空.jpg')}
.half:last-child .hero{background-image:url('/網頁首頁兩張/住家.jpg')}

/* 還沒收縮前：維持原本的 hover 行為 */
.half:hover .wall:not(.hazed){transform:scale(1.10)}
.half:hover .wall:not(.hazed) .hero{filter:brightness(.65)}
/* 收縮之後：滑過去整面牆濃一點、清楚一點 */
.half:hover .wall.hazed{
  opacity:calc(var(--dens) + .22);
  filter:grayscale(calc(var(--gray) * .65)) blur(calc(var(--haze) * .35)) brightness(var(--bright));
  transition:filter .7s ease,opacity .7s ease;
}

.half-content{
  position:relative;z-index:2;width:100%;
  padding:2.5rem;
  border-top:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;align-items:flex-end;
  opacity:0;transform:translateY(10px);
  transition:opacity .6s ease,transform .6s ease;
}
.page.visible .half-content{opacity:1;transform:translateY(0)}
.page.visible .half:nth-child(2) .half-content{transition-delay:.12s}

.label-en{font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:.5rem}
.label-zh{font-size:clamp(1.2rem,2.4vw,1.8rem);font-weight:300;letter-spacing:.04em;color:#fafaf8}
.label-count{font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.22);margin-top:.4rem}
.label-arrow{font-size:1.4rem;color:rgba(255,255,255,.2);transition:color .3s,transform .3s}
.half:hover .label-arrow{color:rgba(255,255,255,.75);transform:translateX(5px)}

/* ── Centre logo (桌機) ── */
.logo{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:20;pointer-events:none;
  opacity:0;transition:opacity .6s ease .5s;
}
.logo img{
  /* 桌機中央 Logo 大小 — 原始 × 300% */
  position:relative;width:216px;height:auto;display:block;
}
.page.visible .logo{opacity:1}

/* 牆浮現的同時，logo 背後升起一層霧化底，層次才出得來 */
.logo-veil{
  position:absolute;left:50%;top:50%;
  width:460px;height:300px;transform:translate(-50%,-50%);
  backdrop-filter:blur(var(--veil)) brightness(.5);
  -webkit-backdrop-filter:blur(var(--veil)) brightness(.5);
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,rgba(0,0,0,.55) 55%,transparent 75%);
          mask-image:radial-gradient(ellipse at center,#000 30%,rgba(0,0,0,.55) 55%,transparent 75%);
  opacity:0;transition:opacity 1.1s ease;
}
.logo.veiled .logo-veil{opacity:1}

/* ── Split line ── */
.split{
  position:fixed;top:0;bottom:0;left:50%;
  width:1px;background:rgba(255,255,255,.1);
  z-index:10;pointer-events:none;
  transform:scaleY(0);transform-origin:center;
  transition:transform .9s ease .3s;
}

/* ── Mobile ── */
@media(max-width:680px){
  body{overflow:hidden}
  .page{
    grid-template-columns:1fr;
    grid-template-rows:1fr 1fr; /* 手機：上下嚴格對分 */
    height:100dvh;             /* 用 dvh 避免 Safari 位址列影響 */
  }
  .half{height:50dvh}          /* 每個 half 絕對 50% */

  .half:first-child .hero{background-image:url('/手機首頁兩張/商空.jpg')}
  .half:last-child .hero{background-image:url('/手機首頁兩張/住家.jpg')}

  /* 手機 Logo — 置中頂部 */
  .logo{
    top:2rem;
    left:50%;
    transform:translateX(-50%);
  }
  .logo img{width:144px} /* 手機 Logo 略小 */
  .logo-veil{width:300px;height:180px}

  .split{display:none}
  .half-content{padding:1.5rem}
}
</style>

<body>

<!-- 進場 curtain -->
<div id="curtain">
  <div id="curtain-logo">
    <img src="/assets/ON_White_logo.png" alt="ON">
  </div>
</div>

<!-- 主畫面 -->
<div class="page" id="page">

  <a href="/en/commercial/" class="half">
    <div class="wall"><div class="grid"></div><div class="hero"></div></div>
    <div class="half-content">
      <div>
        <p class="label-en">Commercial</p>
        <p class="label-zh" style="font-size:13px;opacity:.5">商業空間</p>
        <p class="label-count">18 projects →</p>
      </div>
      <span class="label-arrow">→</span>
    </div>
  </a>

  <a href="/en/residential/" class="half">
    <div class="wall"><div class="grid"></div><div class="hero"></div></div>
    <div class="half-content">
      <div>
        <p class="label-en">Residential</p>
        <p class="label-zh" style="font-size:13px;opacity:.5">住家空間</p>
        <p class="label-count">11 projects →</p>
      </div>
      <span class="label-arrow">→</span>
    </div>
  </a>

</div>

<!-- 中央 Logo -->
<div class="logo" id="logo">
  <div class="logo-veil"></div>
  <img src="/assets/ON_White_logo.png" alt="ON Design Lab">
</div>

<!-- 分割線 -->
<div class="split" id="split"></div>

<!-- 語言切換 -->
<a href="/" style="position:fixed;top:1.6rem;right:1.8rem;z-index:40;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.4);text-decoration:none;border-bottom:0.5px solid rgba(255,255,255,.18);padding-bottom:2px;transition:color .2s">中文</a>

<!-- 版本標記 -->
<div style="position:fixed;bottom:10px;right:12px;z-index:30;font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.18);pointer-events:none">v2.24</div>

<script>
setTimeout(()=>{
  document.getElementById('curtain').classList.add('out');
  setTimeout(()=>{
    document.getElementById('page').classList.add('visible');
    document.getElementById('split').style.transform='scaleY(1)';
  },500);
},1800);

/* ════════ 進站蒙太奇 ════════
   大畫面停一下，再以自己的中心點原地收成整面牆的其中一格。只跑一次，不循環。
   ★ 要調整只改下面這一組數字，其他都不用動。 */
(function(){
  var MONTAGE = {
    n:        7,      /* 桌機格數（只能是奇數，中心格才會等於畫面中心） */
    nMobile:  5,      /* 手機格數 */
    hold:     2600,   /* 大畫面停留（ms） */
    dur:      3600,   /* 收縮時間（ms） */
    fade:     1600,   /* 格子浮現（ms） */
    stagger:  70,     /* 一圈一圈往外浮現的間隔（ms） */
    ease:     'cubic-bezier(.22,.61,.36,1)',
    dens:     28,     /* 牆的濃度 % */
    haze:     5,      /* 照片霧化模糊 px */
    gray:     100,    /* 黑白程度 % */
    bright:   100,    /* 亮度 % */
    veil:     16,     /* logo 背後霧化 px，0 = 關掉 */
    tiles:    81      /* /images/montage/ 每邊的素材張數 */
  };

  /* 系統設定了「減少動態效果」就整段不跑，畫面維持原本的大圖 */
  if (window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) return;

  var M = MONTAGE, root = document.documentElement;
  var mobile = matchMedia('(max-width:680px)').matches;
  var n = mobile ? M.nMobile : M.n;

  root.style.setProperty('--n', n);
  root.style.setProperty('--dur', M.dur + 'ms');
  root.style.setProperty('--fade', M.fade + 'ms');
  root.style.setProperty('--ease', M.ease);
  root.style.setProperty('--dens', M.dens / 100);
  root.style.setProperty('--haze', M.haze + 'px');
  root.style.setProperty('--gray', M.gray / 100);
  root.style.setProperty('--bright', M.bright / 100);
  root.style.setProperty('--veil', M.veil + 'px');

  var halves = document.querySelectorAll('.page > .half');
  var sides  = ['c', 'r'];

  Array.prototype.forEach.call(halves, function(half, si){
    var wall = half.querySelector('.wall');
    var grid = half.querySelector('.grid');
    var hero = half.querySelector('.hero');
    var total = n * n, tiles = [];

    for (var i = 0; i < total; i++){
      var d = document.createElement('div');
      d.className = 'tile';
      /* 先不掛圖 — 等大畫面停留那幾秒才載，不跟它搶頻寬 */
      d.dataset.src = "url('/images/montage/" + sides[si] + "-"
                    + ('0' + ((i % M.tiles) + 1)).slice(-2) + ".webp')";
      grid.appendChild(d);
      tiles.push(d);
    }

    /* 起跑點：curtain 收掉、畫面淡入完成之後，左右再錯開 0.9 秒 */
    setTimeout(function(){
      tiles.forEach(function(t){
        if (t.dataset.src){ t.style.backgroundImage = t.dataset.src; delete t.dataset.src; }
      });

      setTimeout(function(){
        var mid = (n - 1) / 2, cell = mid * n + mid;
        tiles.forEach(function(t, i){
          if (i === cell) return;                 /* 這格由大畫面自己佔著 */
          var d = Math.max(Math.abs(i % n - mid), Math.abs(Math.floor(i / n) - mid));
          t.style.transitionDelay = (d * M.stagger) + 'ms';
          t.className = 'tile on';
        });
        hero.style.transform = 'scale(' + (1 / n) + ')';
        wall.className = 'wall hazed';
        if (M.veil) document.getElementById('logo').className = 'logo veiled';
        setTimeout(function(){
          tiles.forEach(function(t){ t.style.transitionDelay = '0ms'; });
        }, M.dur);
      }, M.hold);
    }, 2400 + si * 900);
  });
})();
</script>
</body>
