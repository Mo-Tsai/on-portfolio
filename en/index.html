<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden}
a{color:#fafaf8;text-decoration:none}

/* ── Curtain ── */
#curtain{
  position:fixed;inset:0;z-index:200;
  background:#0a0a0a;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1s ease;
}
#curtain.out{opacity:0;pointer-events:none}
#curtain-logo{opacity:0;animation:cFade .8s ease .4s forwards}
#curtain-logo img{
  /* 進場 Logo 大小 — 可調整 */
  width:216px;height:auto;display:block;
}
@keyframes cFade{
  0%{opacity:0;transform:translateY(6px)}
  100%{opacity:1;transform:translateY(0)}
}

/* ── Page layout ── */
.page{
  height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr; /* 桌機：左右對分 */
  opacity:0;transition:opacity .8s ease;
}
.page.visible{opacity:1}

/* ── Each half ── */
.half{
  position:relative;overflow:hidden;cursor:pointer;
  display:flex;align-items:flex-end;
}
.half-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  /* ★ 桌機背景圖路徑 — 請告知後填入 */
  /* Commercial: background-image:url('...'); */
  /* Residential: background-image:url('...'); */
  filter:brightness(.45);
  transition:filter .7s ease,transform .9s ease;
}
.half:hover .half-bg{filter:brightness(.65);transform:scale(1.04)}

.half-content{
  position:relative;z-index:2;width:100%;
  padding:2.5rem;
  border-top:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;align-items:flex-end;
  opacity:0;transform:translateY(10px);
  transition:opacity .6s ease,transform .6s ease;
}
.page.visible .half-content{opacity:1;transform:translateY(0)}
.page.visible .half:nth-child(2) .half-content{transition-delay:.12s}

.label-en{font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:.5rem}
.label-zh{font-size:clamp(1.2rem,2.4vw,1.8rem);font-weight:300;letter-spacing:.04em;color:#fafaf8}
.label-count{font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.22);margin-top:.4rem}
.label-arrow{font-size:1.4rem;color:rgba(255,255,255,.2);transition:color .3s,transform .3s}
.half:hover .label-arrow{color:rgba(255,255,255,.75);transform:translateX(5px)}

/* ── Centre logo (桌機) ── */
.logo{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:20;pointer-events:none;
  opacity:0;transition:opacity .6s ease .5s;
}
.logo img{
  /* 桌機中央 Logo 大小 — 原始 × 300% */
  width:216px;height:auto;display:block;
}
.page.visible .logo{opacity:1}

/* ── Tagline ── */
.tagline{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,60px);
  z-index:20;pointer-events:none;
  text-align:center;
  opacity:0;transition:opacity .8s ease .8s;
}
.page.visible .tagline{opacity:1}
.tagline-zh{font-size:clamp(1rem,2vw,1.4rem);font-weight:300;letter-spacing:.1em;color:rgba(255,255,255,.7);margin-bottom:.4rem}
.tagline-en{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:.8rem}
.tagline-desc{font-size:11px;line-height:1.8;color:rgba(255,255,255,.28);max-width:320px;margin:0 auto}

/* ── Split line ── */
.split{
  position:fixed;top:0;bottom:0;left:50%;
  width:1px;background:rgba(255,255,255,.1);
  z-index:10;pointer-events:none;
  transform:scaleY(0);transform-origin:center;
  transition:transform .9s ease .3s;
}

/* ── Mobile ── */
@media(max-width:680px){
  body{overflow:hidden}
  .page{
    grid-template-columns:1fr;
    grid-template-rows:1fr 1fr; /* 手機：上下嚴格對分 */
    height:100dvh;             /* 用 dvh 避免 Safari 位址列影響 */
  }
  .half{height:50dvh}          /* 每個 half 絕對 50% */

  .half:first-child .half-bg{
    background-image:url('/手機首頁兩張/商空.jpg') !important;
  }
  .half:last-child .half-bg{
    background-image:url('/手機首頁兩張/住家.jpg') !important;
  }

  /* 手機 Logo — 置中頂部 */
  .logo{
    top:2rem;
    left:50%;
    transform:translateX(-50%);
  }
  .logo img{width:144px} /* 手機 Logo 略小 */

  .tagline{
    top:auto;bottom:50%;left:50%;
    transform:translate(-50%,50%);
    transition-delay:.6s;
  }
  .tagline-desc{font-size:10px;max-width:260px}

  .split{display:none}
  .half-content{padding:1.5rem}
}
</style>

<script>
setTimeout(()=>{
  document.getElementById('curtain').classList.add('out');
  setTimeout(()=>{
    document.getElementById('page').classList.add('visible');
    document.getElementById('split').style.transform='scaleY(1)';
  },500);
