html,body{height:100%;background:#0a0a0a;font-family:var(--font);overflow:hidden}
a{color:#fafaf8;text-decoration:none}

/* ── Curtain ── */
#curtain{
  position:fixed;inset:0;z-index:200;
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1s ease;
}
#curtain.out{opacity:0;pointer-events:none}
#curtain-logo{opacity:0;animation:cFade .8s ease .4s forwards}
#curtain-logo img{

}
@keyframes cFade{
  0%{opacity:0;transform:translateY(6px)}
  100%{opacity:1;transform:translateY(0)}
}
/* ── Entrance「斜線切開」（Mo 09-29 定案）──
   黑幕＝ON 標誌＋「Entrance」，等按才進站。斜線＝ON 標誌本身那條切線（往右上 16.545°），
   角度與位置從 ON_White_logo.png 量出來（見首頁 script 的 CUT）。
   兩片黑幕用 clip-path 沿斜線分開，各自往垂直於斜線的方向滑出；金線只做 1px 細線。 */
.c-half{position:absolute;left:0;right:0;top:0;bottom:0;background:#0a0a0a;
  transition:transform 1.333s cubic-bezier(.65,0,.35,1)}
#curtain-inner{position:relative;transition:opacity .35s ease}
#curtain.cut #curtain-inner{opacity:0}
#curtain.cut{pointer-events:none}
#curtain.wait{cursor:pointer;-webkit-tap-highlight-color:transparent}
#curtain:focus{outline:none}
#curtain-logo{position:relative}
#curtain-logo img{position:relative}
#entrance{
  position:absolute;left:50%;top:100%;transform:translateX(-50%);
  margin-top:30px;padding-left:.42em;white-space:nowrap;
  font-size:12.8px;font-weight:400;letter-spacing:.42em;color:rgba(255,255,255,.5);
  opacity:0;animation:tapFade 1s ease 1.2s forwards;
}
@keyframes tapFade{0%{opacity:0}100%{opacity:1}}
#slit,#slash{position:fixed;left:0;top:0;height:1px;transform-origin:0 50%;pointer-events:none}
#slit{z-index:1;opacity:0;
  background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.7) 50%,transparent 100%) no-repeat;
  background-size:26% 100%;background-position:-30% 0}
#curtain.wait #slit{animation:slitIn 1s ease 1.6s forwards,slitRun 7.2s ease-in-out 2s infinite}
@keyframes slitIn{to{opacity:.55}}
@keyframes slitRun{0%{background-position:-30% 0}45%,100%{background-position:130% 0}}
#slash{display:none;z-index:3;background:#BEA578;opacity:0}
#curtain.cut #slash{display:block;animation:slashOut 1.1s ease forwards}
@keyframes slashOut{0%{opacity:0;clip-path:inset(0 50% 0 50%)}12%{opacity:.9}30%{clip-path:inset(0 0 0 0);opacity:.9}100%{clip-path:inset(0 0 0 0);opacity:0}}
/* 減少動態效果：不走光，按下只淡出 */
#curtain.calm #slit{animation:none!important;opacity:0!important}
#curtain.calm #entrance{animation:none;opacity:1}
/* 站內換頁回首頁：牆直接停在收好的樣子（不跑轉場） */
.still .wall,.still .hero,.still .tile,.still .logo img,.still .logo-veil{transition:none!important}

/* ── Page layout ── */
.page{
  height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr; /* 桌機：左右對分 */
  opacity:0;transition:opacity .8s ease;
}
.page.visible{opacity:1}

/* ── Each half ── */
.half{
  position:relative;overflow:hidden;cursor:pointer;
  display:flex;align-items:flex-end;
}
/* ── 進站蒙太奇 ──
   大畫面停一下，再以自己的中心點原地收成整面牆的其中一格。
   數值都在頁尾 <script> 的 MONTAGE 設定裡，只有那一處要改。
   關掉 JS、或系統設定了「減少動態效果」時，畫面就停在原本的大圖，跟以前一樣。 */
.wall{
  position:absolute;inset:0;
  transform:scale(1.06);              /* 放大一點，讓模糊的邊緣落在畫面外，不會有暈邊 */
  transition:filter var(--dur) ease,opacity var(--dur) ease,transform .9s ease;
}
.wall.hazed{
  filter:grayscale(var(--gray)) blur(var(--haze)) brightness(var(--bright));
  opacity:var(--dens);
}
.grid{
  position:absolute;inset:0;display:grid;
  grid-template-columns:repeat(var(--n),1fr);
  grid-template-rows:repeat(var(--n),1fr);
}
.tile{background-size:cover;background-position:center;opacity:0;transition:opacity var(--fade) ease}
.tile.on{opacity:1}

.hero{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background-size:cover;background-position:center;
  transform-origin:center center;     /* 以自己的中心點收縮，不需要任何位移 */
  filter:brightness(.45);             /* 靜止時跟原本的首頁一樣暗，下方文字才讀得到 */
  transition:transform var(--dur) var(--ease),filter var(--dur) ease;
  will-change:transform;
}
.wall.hazed .hero{filter:brightness(1)}   /* 收進去之後，亮度統一交給整面牆控制 */
.half:first-child .hero{background-image:url('/網頁首頁兩張/商空.jpg')}
.half:last-child .hero{background-image:url('/網頁首頁兩張/住家.jpg')}

/* 還沒收縮前：維持原本的 hover 行為 */
.half:hover .wall:not(.hazed){transform:scale(1.10)}
.half:hover .wall:not(.hazed) .hero{filter:brightness(.65)}
/* 收縮之後：滑過去整面牆濃一點、清楚一點 */
.half:hover .wall.hazed{
  opacity:calc(var(--dens) + .22);
  filter:grayscale(calc(var(--gray) * .65)) blur(calc(var(--haze) * .35)) brightness(var(--bright));
  transition:filter .7s ease,opacity .7s ease;
}

.half-content{
  position:relative;z-index:2;width:100%;
  padding:2.5rem;
  border-top:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;align-items:flex-end;
  opacity:0;transform:translateY(10px);
  transition:opacity .6s ease,transform .6s ease;
}
.page.visible .half-content{opacity:1;transform:translateY(0)}
.page.visible .half:nth-child(2) .half-content{transition-delay:.12s}

.label-en{font-size:12.8px;letter-spacing:.22em;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:.5rem}
.label-zh{font-size:clamp(20px, 2.4vw, 31px);font-weight:300;letter-spacing:.04em;color:#fafaf8}
.label-count{font-size:12.8px;letter-spacing:.1em;color:rgba(255,255,255,.22);margin-top:.4rem}
.label-arrow{font-size:20px;color:rgba(255,255,255,.2);transition:color .3s,transform .3s;font-weight:300}
.half:hover .label-arrow{color:rgba(255,255,255,.75);transform:translateX(5px)}

/* ── Centre logo (桌機) ── */
/* ★ 容器本身永遠不透明。
   淡入改套在「圖」和「霧化底」各自身上 ——
   祖先只要 opacity < 1，backdrop-filter 就整個失效，
   會變成 logo 先到位、後面才突然開始糊。 */
.logo{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:20;pointer-events:none;
}
.logo img{
  /* 桌機中央 Logo 大小 — 原始 × 300% */
  position:relative;width:216px;height:auto;display:block;
  opacity:0;transition:opacity .6s ease .5s;
}
/* logo 在 .page 外面，用「相鄰兄弟」才選得到。
   原本寫成 .page.visible .logo（.page 裡面的 logo），永遠對不上，
   所以中央 logo 從以前到現在都是隱形的 —— 這裡一併修掉。
   （沒有 JS 或減少動態效果時，就靠這兩條直接顯示） */
.page.visible ~ .logo img{opacity:1}
.page.visible ~ .logo .logo-veil{opacity:1}

/* logo 背後的霧化底。放在 .logo 裡面，位置才會自動跟著手機版一起移到頂端。 */
.logo-veil{
  position:absolute;left:50%;top:50%;
  width:460px;height:300px;transform:translate(-50%,-50%);
  backdrop-filter:blur(var(--veil)) brightness(.5);
  -webkit-backdrop-filter:blur(var(--veil)) brightness(.5);
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,rgba(0,0,0,.55) 55%,transparent 75%);
          mask-image:radial-gradient(ellipse at center,#000 30%,rgba(0,0,0,.55) 55%,transparent 75%);
  opacity:0;transition:opacity .6s ease .5s;
}

/* ── Split line ── */
.split{
  position:fixed;top:0;bottom:0;left:50%;
  width:1px;background:rgba(255,255,255,.1);
  z-index:10;pointer-events:none;
  transform:scaleY(0);transform-origin:center;
  transition:transform .9s ease .3s;
}

/* ── Mobile ── */
@media(max-width:680px){
  body{overflow:hidden}
  .page{
    grid-template-columns:1fr;
    grid-template-rows:1fr 1fr; /* 手機：上下嚴格對分 */
    height:100dvh;             /* 用 dvh 避免 Safari 位址列影響 */
  }
  .half{height:50dvh}          /* 每個 half 絕對 50% */

  .half:first-child .hero{background-image:url('/手機首頁兩張/商空.jpg')}
  .half:last-child .hero{background-image:url('/手機首頁兩張/住家.jpg')}

  .logo{display:none}

  .split{display:none}
  .half-content{padding:1.5rem}
  .half:last-child .half-content{padding-bottom:2.6rem}  /* 讓出左下角 Sound on／off */
}

/* 沒有 sound.js 時的備用時鐘（performance.now） */
function perfClock(){ var z = performance.now(); return { t: function(){ return (performance.now() - z) / 1000; } }; }

/* ════════ 黑幕（Entrance）════════ */
(function(){
  var curtain = document.getElementById('curtain');

  var split   = document.getElementById('split');

  var reduce  = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

  if (window.ON_SPA_NAV) {
    curtain.style.display = 'none';
    page.style.transition = 'none'; showPage();
    if (MT) MT.play('still');

    return;
  }

  if (reduce) curtain.classList.add('calm');

     2026-09-29 從 /assets/ON_White_logo.png（1537×1028）實際量：標誌有 5 個缺口（O 左下、O 右側、N 左直筆、N 斜筆、N 右直筆），
     每個缺口兩條切邊擬合，缺口寬 32 px；五個缺口中心做最小最大偏差直線：往右上 16.545°，
     在圖左緣 x=0 時 y=678.86、右緣 x=1537 時 y=222.27（最大偏差 8.5 px，小於半個缺口 16 px → 線一定在缺口裡）。
     下面用「佔圖高的比例」存，畫面上照標誌實際顯示的位置換算（桌機、手機都一樣）。 */
  var CUT = { yL: 678.86 / 1028, yR: 222.27 / 1028 };
  var cutGeo = null;
  function cutLine(){
    var img = curtain.querySelector('#curtain-logo img');
    var r = img.getBoundingClientRect(), W = innerWidth, H = innerHeight;
    var x0 = r.left, y0 = r.top + r.height * CUT.yL, x1 = r.right, y1 = r.top + r.height * CUT.yR;
    var k = (y1 - y0) / (x1 - x0);                       /* 斜率（負值＝往右上） */
    var yAt = function(x){ return y0 + k * (x - x0); };
    var ang = Math.atan(k), len = Math.sqrt(1 + k * k);
    var nx = -k / len, ny = 1 / len;                     /* 法向量（指向右下） */
    var far = 0;                                         /* 最遠的角落到斜線的距離：滑這麼遠才會完全出畫面 */
    [[0,0],[W,0],[0,H],[W,H]].forEach(function(p){ far = Math.max(far, Math.abs((p[0] - x0) * nx + (p[1] - y0) * ny)); });
    return { x0: x0, y0: y0, x1: x1, y1: y1, k: k, ang: ang, yL: yAt(0), yR: yAt(W), W: W, H: H, nx: nx, ny: ny, far: far + 40 };
  }
  function layoutCut(){
    var g = cutGeo = cutLine();
    var halves = curtain.querySelectorAll('.c-half');
    halves[0].style.clipPath = 'polygon(0 0,' + g.W + 'px 0,' + g.W + 'px ' + g.yR + 'px,0 ' + g.yL + 'px)';
    halves[1].style.clipPath = 'polygon(0 ' + g.yL + 'px,' + g.W + 'px ' + g.yR + 'px,' + g.W + 'px ' + g.H + 'px,0 ' + g.H + 'px)';
    /* 待機走光：只走標誌那一段 */
    var slit = document.getElementById('slit'), segLen = Math.hypot(g.x1 - g.x0, g.y1 - g.y0);
    slit.style.width = segLen + 'px';
    slit.style.transform = 'translate(' + g.x0 + 'px,' + g.y0 + 'px) rotate(' + g.ang + 'rad)';
    /* 按下去的金線：從螢幕左緣到右緣 */
    var slash = document.getElementById('slash'), full = Math.hypot(g.W, g.yR - g.yL);

  }

      if (!reduce) {
        layoutCut();
        var g = cutGeo, hv = curtain.querySelectorAll('.c-half');
        curtain.classList.add('cut');
        hv[0].style.transform = 'translate(' + (-g.nx * g.far) + 'px,' + (-g.ny * g.far) + 'px)';   /* 左上片往左上 */
        hv[1].style.transform = 'translate(' + (g.nx * g.far) + 'px,' + (g.ny * g.far) + 'px)';     /* 右下片往右下 */
        setTimeout(function(){ curtain.classList.add('out'); }, ENTRY.cutMs);
      } else {
        curtain.classList.add('out');
      }
      showPage();
    });
    if (MT) MT.play('beat', clock);
    /* 保險：萬一時鐘一直沒起來（音訊被系統卡住），1.2 秒後黑幕照樣打開，不讓人卡在黑畫面 */
    setTimeout(function(){
      if (curtain.classList.contains('out') || curtain.classList.contains('cut')) return;
      beatLog('curtain-watchdog', 0, clock.t());
      curtain.classList.add('out'); showPage();
    }, 1200);
  }

  /* 滑鼠：按下那一刻；觸控：手指離開那一刻（瀏覽器只在這兩種時機准許出聲） */
  curtain.addEventListener('pointerdown', function(e){ if (e.pointerType === 'mouse' && e.button === 0) enter(e); });
  curtain.addEventListener('pointerup',   function(e){ if (e.pointerType !== 'mouse') enter(e); });
  curtain.addEventListener('touchend', enter);
  curtain.addEventListener('click', enter);
  addEventListener('keydown', function(e){
    if (!opened && (e.key === 'Enter' || e.key === ' ')) enter(e);
  });
})();
</script>
