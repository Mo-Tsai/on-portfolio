<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — ON Design Lab</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #0e0e0c; color: #f0efe8; display: flex; align-items: center; justify-content: center; }
  .center { text-align: center; display: flex; flex-direction: column; align-items: center; }
  .logo-img { width: 96px; margin-bottom: 36px; opacity: 0.92; }
  .code { font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: #4a4a44; margin-bottom: 14px; }
  .msg { font-size: 20px; font-weight: 300; letter-spacing: 0.08em; color: #f0efe8; margin-bottom: 8px; }
  .msg-en { font-size: 11px; font-style: italic; letter-spacing: 0.06em; color: #666660; margin-bottom: 40px; }
  .links { display: flex; gap: 28px; }
  .links a { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: #4a4a44; text-decoration: none; padding-bottom: 2px; border-bottom: 0.5px solid transparent; transition: all 0.2s; }
  .links a:hover { color: #f0efe8; border-color: #f0efe8; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="center">
  <img class="logo-img" src="/assets/ON_White_logo.png" alt="ON Design Lab">
  <p class="code">404</p>
  <p class="msg">這個空間不存在</p>
  <p class="msg-en">This space hasn't been designed yet.</p>
  <div class="links">
    <a href="/">Home</a>
    <a href="/commercial/">Commercial</a>
    <a href="/residential/">Residential</a>
    <a href="/journal/">Journal</a>
  </div>
</div>
</body>
</html>
